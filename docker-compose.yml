# compose.yaml
services:
  laravel-app:
    image: ${APP_IMAGE:-ghcr.io/khoirul2009/laravel-starter-kit:latest}
    entrypoint: php artisan octane:frankenphp --workers=4 --max-requests=200 --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - laravel-storage:/app/storage

volumes:
  laravel-storage:
